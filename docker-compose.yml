services:

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydb
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net

  web:
    image: nginx:alpine
    ports:
      - "80:80"
    networks:
      - frontend_net

  app:
    image: alpine
    command: sleep infinity
    networks:
      - frontend_net
      - backend_net

networks:
  frontend_net:
    driver: bridge

  backend_net:
    driver: bridge

volumes:
  mysql_data:
    driver: local